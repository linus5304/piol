name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Run on PR open/sync, or when someone comments @claude on a PR
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR for:
            1. Security issues (auth, XSS, injection, secrets exposure)
            2. Bugs or logic errors
            3. Performance concerns
            4. Alignment with the project's conventions (Biome formatting, Convex patterns, Tailwind design tokens)

            This is a Cameroon housing marketplace using Next.js 16, Convex, Clerk auth, and Tailwind v4.
            Be concise. Only flag genuine issues, not style preferences.
