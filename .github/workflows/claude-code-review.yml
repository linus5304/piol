name: Claude Code Review

on:
  pull_request:
    types: [opened]
    branches: [main]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Run on PR open only, or when someone comments @claude on a PR
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-haiku-4-5-20251001"
          prompt: |
            Review this PR for:
            1. Security issues (auth, XSS, injection, secrets exposure)
            2. Bugs or logic errors
            3. Performance concerns

            This is a Next.js 16 + Convex + Clerk app. Be concise. Only flag genuine issues.
